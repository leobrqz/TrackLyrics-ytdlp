name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri installers
        run: npm run tauri build

      - name: Stage release files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = '${{ github.ref_name }}'
          $stage = 'release-package'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          $msi = Get-ChildItem 'src-tauri/target/release/bundle/msi/*.msi' -ErrorAction SilentlyContinue | Select-Object -First 1
          $setup = Get-ChildItem 'src-tauri/target/release/bundle/nsis/*-setup.exe' -ErrorAction SilentlyContinue | Select-Object -First 1

          if ($null -eq $msi -or $null -eq $setup) {
            throw 'Tauri must produce both the MSI and NSIS installer before a release can be published.'
          }
          Copy-Item -LiteralPath $msi.FullName -Destination "$stage/TrackLyrics-$tag-x64.msi"
          Copy-Item -LiteralPath $setup.FullName -Destination "$stage/TrackLyrics-$tag-x64-setup.exe"
          Copy-Item -LiteralPath 'README.md' -Destination $stage
          Compress-Archive -Path "$stage/*" -DestinationPath "TrackLyrics-$tag-windows.zip" -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: TrackLyrics ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release-package/TrackLyrics-${{ github.ref_name }}-x64.msi
            release-package/TrackLyrics-${{ github.ref_name }}-x64-setup.exe
            TrackLyrics-${{ github.ref_name }}-windows.zip
