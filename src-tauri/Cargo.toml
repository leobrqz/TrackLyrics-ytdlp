[package]
name = "tracklyrics"
version = "1.1.0"
description = "Local music library, lyrics, downloads, and playback"
authors = ["TrackLyrics contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "tracklyrics_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-shell = "2"
tokio = { version = "1", features = ["sync", "time"] }
